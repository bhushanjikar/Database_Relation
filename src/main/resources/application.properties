# Name of this Spring Boot application (shown in logs)
spring.application.name=jpademo

# ---- MySQL connection ------------------------------------------------------------------
# jdbc:mysql://<host>:<port>/<database name>   (create the schema "database_relation" in MySQL first)
spring.datasource.url=${URL}
spring.datasource.username=${USERNAME}
spring.datasource.password=${PASSWORD}
# ---- JPA / Hibernate -------------------------------------------------------------------
# ddl-auto=update : Hibernate creates the tables (user, profile, post, tag, post_tags) from the
#                   entities if they are missing and adds new columns, but never drops anything.
#                   (create = rebuild on every start, none = do nothing)
spring.jpa.hibernate.ddl-auto=update
# Tells Hibernate which SQL flavour to generate (MySQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Print every SQL statement in the console - very useful while revising to SEE what each
# relation / cascade / service method really executes.
spring.jpa.show-sql=true
